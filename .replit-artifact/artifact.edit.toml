kind = "web"
previewPath = "/"
title = "KRX 고래 추적기"
version = "1.0.0"
id = "korean-stock-tracker"

[[services]]
localPort = 8000
name = "web"
paths = ["/"]

[services.env]
PORT = "8000"

[services.development]
run = "cd artifacts/korean-stock-tracker && python main.py"

[services.production]

[services.production.build]
args = ["echo", "no build needed"]

[services.production.run]
args = ["python", "artifacts/korean-stock-tracker/main.py"]

[services.production.run.env]
PORT = "8000"

[services.production.health.startup]
path = "/api/health"
